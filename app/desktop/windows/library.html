<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>icon – library</title>
    <style>
      html, body { height: 100%; margin: 0; background: #111; }
      #libview { position: fixed; inset: 0; border: 0; }
    </style>
  </head>
  <body>
    <div id="brand" style="position:fixed; inset:0; display:grid; place-items:center; pointer-events:none; color:#ddd; text-transform:none; letter-spacing:.5px;">
      <div style="display:flex; flex-direction:column; align-items:center; gap:10px">
        <img src="../build/icon.png" alt="Icon" style="width:92px; height:92px; border-radius:20px; box-shadow:0 8px 30px rgba(0,0,0,.35)"/>
        <div style="font:700 32px/1.1 system-ui, -apple-system, 'Segoe UI', Roboto">icon</div>
      </div>
    </div>
    <div id="toolbar" style="position:fixed; top:0; left:0; right:0; height:42px; display:flex; align-items:center; gap:10px; padding:0 10px; background:rgba(17,17,17,.85); color:#fff; z-index:20; -webkit-user-select:none;">
      <img src="../build/icon.png" width="18" height="18" alt="Icon" style="border-radius:4px; box-shadow:0 1px 2px rgba(0,0,0,.25)"/>
      <div style="font:600 14px system-ui; letter-spacing:.3px">icon</div>
      <div style="opacity:.65; margin-left:6px">·</div>
      <button id="nav-library" style="background:transparent; border:0; color:#fff; opacity:.9; cursor:pointer; padding:6px 8px; border-radius:8px">Library</button>
      <button id="nav-store" style="background:#2563eb; border:0; color:#fff; cursor:pointer; padding:6px 10px; border-radius:8px">Store</button>
      <div style="margin-left:auto; display:flex; gap:8px; align-items:center">
        <button id="nav-hotkeys" title="Shortcuts" style="background:transparent; border:1px solid rgba(255,255,255,.25); color:#fff; cursor:pointer; padding:4px 8px; border-radius:8px">Hotkeys</button>
        <button id="nav-clear" title="Clear overlays" style="background:#ef4444; border:0; color:#fff; cursor:pointer; padding:6px 10px; border-radius:8px">Clear</button>
      </div>
    </div>
    <!-- BrowserView now renders the content; webview kept hidden as a fallback placeholder -->
    <webview id="libview" src="about:blank" style="display:none"></webview>

    <script>
      const libview = document.getElementById('libview');
      const brand = document.getElementById('brand');
      document.addEventListener('DOMContentLoaded', () => {
        try { if (brand) brand.style.display = 'none'; } catch {}

        function showLibrary(){ try { window.api?.browser?.show?.('library'); } catch {} }
        function showStore(){ try { window.api?.browser?.show?.('store'); } catch {} }
        document.getElementById('nav-library')?.addEventListener('click', showLibrary);
        document.getElementById('nav-store')?.addEventListener('click', showStore);
        document.getElementById('nav-hotkeys')?.addEventListener('click', () => { try { window.api?.browser?.hotkeys?.(); } catch(e) { console.error('hotkeys call failed', e); } });
        document.getElementById('nav-clear')?.addEventListener('click', () => { try { window.icon?.clearOverlays?.(); } catch {} try { window.api?.overlays?.clearAll?.(); } catch {} });
      });
    </script>
  </body>
</html>
